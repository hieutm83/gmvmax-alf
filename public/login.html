<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" href="/FAVICON.png">
    <title>Đăng nhập | AnlanhFarm</title>
    <style>
      :root { color-scheme:light; --primary:#2563eb; --primary-hover:#1d4ed8; --text:#0f172a; --muted:#64748b; --border:#dbe3ee; --surface:#fff; --background:#f3f7fb; --danger:#dc2626; }
      * { box-sizing:border-box; }
      body,button,input { font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      body { min-width:320px; min-height:100dvh; display:grid; place-items:center; margin:0; padding:24px; color:var(--text); background:var(--background); }
      .login-card { width:min(360px,100%); padding:34px 30px 30px; background:var(--surface); border:1px solid #e8edf4; border-radius:12px; box-shadow:0 24px 60px rgba(15,23,42,.16); text-align:center; }
      .brand { margin:0; color:var(--primary); font-size:27px; font-weight:800; letter-spacing:-.6px; line-height:1; }
      .security { display:block; margin-top:7px; color:#94a3b8; font-size:9px; font-weight:800; letter-spacing:1.8px; text-transform:uppercase; }
      .intro { margin:28px 0 20px; color:var(--muted); font-size:12px; }
      form { display:grid; gap:12px; }
      input,button { width:100%; min-height:44px; border-radius:7px; font:inherit; }
      input { padding:0 14px; color:var(--text); background:#fff; border:1px solid var(--border); text-align:center; outline:none; }
      input::placeholder { color:#a8b1c1; }
      input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.14); }
      button { display:flex; align-items:center; justify-content:center; padding:0 16px; color:#fff; background:var(--primary); border:1px solid var(--primary); font-weight:750; cursor:pointer; box-shadow:0 8px 18px rgba(37,99,235,.18); }
      button:hover { background:var(--primary-hover); border-color:var(--primary-hover); }
      button:disabled { cursor:wait; opacity:.65; }
      .error { min-height:18px; margin:0; color:var(--danger); font-size:11px; text-align:left; }
    </style>
  </head>
  <body>
    <main class="login-card">
      <h1 class="brand">ANLANHFARM</h1>
      <span class="security">Bảo mật hệ thống</span>
      <p class="intro">Vui lòng nhập mã khóa để truy cập dữ liệu.</p>
      <form id="loginForm">
        <input id="password" type="password" autocomplete="current-password" placeholder="Nhập mã khóa..." aria-label="Mã khóa" required autofocus>
        <p id="error" class="error" role="alert"></p>
        <button id="submit" type="submit">Mở khóa</button>
      </form>
    </main>
    <script>
      var form=document.getElementById('loginForm');var submit=document.getElementById('submit');var errorBox=document.getElementById('error');
      form.addEventListener('submit',function(event){event.preventDefault();submit.disabled=true;submit.textContent='Đang kiểm tra...';errorBox.textContent='';
        fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})})
          .then(function(response){return response.json().catch(function(){return{ok:false,error:'Phản hồi đăng nhập không hợp lệ.'};}).then(function(payload){if(!response.ok||payload.ok===false)throw new Error(payload.error||'Không thể đăng nhập.');return payload;});})
          .then(function(){var next=new URLSearchParams(location.search).get('next')||'/';location.replace(next.charAt(0)==='/'&&next.slice(0,2)!=='//'?next:'/');})
          .catch(function(error){errorBox.textContent=error.message||String(error);document.getElementById('password').select();submit.disabled=false;submit.textContent='Mở khóa';});
      });
    </script>
  </body>
</html>
