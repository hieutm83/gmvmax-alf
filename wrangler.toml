name = "tiktok-gmv-max-report"
main = "src/index.ts"
compatibility_date = "2026-07-29"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
MCP_URL = "https://business-api.tiktok.com/open_mcp/tt-ads-mcp-flat"
MCP_SCOPE = "mcp:tt4b"
DEFAULT_ADVERTISER_ID = "7535665207776231441"
DEFAULT_STORE_CODE = "VNLC33LWAS"
TIMEZONE = "Asia/Bangkok"
PUBLIC_BASE_URL = "https://tiktok-gmv-max-report.tolahatdoxanh.workers.dev"
ZALO_ADVERTISER_ID = "7535665207776231441"
ZALO_STORE_CODE = "VNLC33LWAS"
ZALO_STORE_ID = "7496309672412416866"
ZALO_OPERATIONS_GROUP_NAME = "[AnlanhFarm]-TMDT"
TIKTOK_SHOP_APP_KEY = "6kqcmsfamo07g"

[[d1_databases]]
binding = "DB"
database_name = "gmv-max-db"
database_id = "c4578be9-d6cf-4652-8f17-684a9ab7598f"
migrations_dir = "migrations"

[[queues.producers]]
binding = "TASK_QUEUE"
queue = "gmv-max-tasks"

[[queues.producers]]
binding = "ZALO_INBOX_QUEUE"
queue = "gmv-max-zalo-inbox"

[[queues.producers]]
binding = "TRACKING_QUEUE"
queue = "gmv-max-tracking"

[[queues.consumers]]
queue = "gmv-max-tasks"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
max_concurrency = 8
dead_letter_queue = "gmv-max-dead-letter"

[[queues.consumers]]
queue = "gmv-max-zalo-inbox"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
max_concurrency = 4
dead_letter_queue = "gmv-max-dead-letter"

[[queues.consumers]]
queue = "gmv-max-tracking"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
max_concurrency = 1
dead_letter_queue = "gmv-max-dead-letter"

[[durable_objects.bindings]]
name = "OAUTH_COORDINATOR"
class_name = "OAuthCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OAuthCoordinator"]

[triggers]
crons = ["* * * * *"]
