name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Select account-specific Worker configuration
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=d4e2d1ad2c863c7992b948fd0b45479b" >> "$GITHUB_ENV"
            echo "CONFIG_PATH=wrangler-realtime.toml" >> "$GITHUB_ENV"
            echo "D1_NAME=gmv-max-runtime-db" >> "$GITHUB_ENV"
          else
            echo "CONFIG_PATH=wrangler.toml" >> "$GITHUB_ENV"
            echo "D1_NAME=gmv-max-db" >> "$GITHUB_ENV"
          fi
      - name: Apply D1 migrations
        if: github.event_name != 'workflow_dispatch'
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote --config "$CONFIG_PATH"
      - name: Deploy Worker
        run: npx wrangler deploy --config "$CONFIG_PATH"
      - name: Reconcile routes, queues and Cron triggers
        run: npx wrangler triggers deploy --config "$CONFIG_PATH"
